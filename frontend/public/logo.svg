<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Container -->
  <g transform="translate(20, 10)">
    <!-- Outer Shield / Hexagon -->
    <path d="M50 5 L88 25 L88 75 L50 95 L12 75 L12 25 Z" fill="url(#shieldGrad)" stroke="url(#primaryGrad)" stroke-width="3" filter="url(#glow)"/>
    
    <!-- Dynamic Lightning Bolt / Recovery Surge -->
    <path d="M54 22 L34 52 L48 52 L44 78 L68 46 L52 46 Z" fill="url(#primaryGrad)"/>

    <!-- Pulse Dot -->
    <circle cx="50" cy="50" r="3" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <g transform="translate(130, 72)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="-1">
      RevClaim
    </text>
    <text x="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="url(#primaryGrad)" letter-spacing="-1">
      AI
    </text>
    
    <!-- Subtitle / Tagline -->
    <text y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="13" fill="#94a3b8" letter-spacing="2">
      AUTONOMOUS INVOICE RECOVERY
    </text>
  </g>
</svg>
